name: Lua checks
on: [push, pull_request]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.2
      - run: find processoros tests -name '*.lua' -exec luac5.2 -p {} \;
      - run: luac5.2 -p install.lua startup.lua update
      - run: lua5.2 tests/test_processor_core.lua && lua5.2 tests/test_processor_network.lua && lua5.2 tests/test_processor_registration.lua && lua5.2 tests/test_processor_marker.lua && lua5.2 tests/test_processor_config.lua && lua5.2 tests/test_processor_update.lua && lua5.2 tests/test_processor_console.lua
